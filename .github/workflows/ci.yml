name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Static-rules baseline
        run: ANTHROPIC_API_KEY= reviewpilot eval --offline --json eval-offline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: With Claude (when the secret is configured)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: reviewpilot eval --json eval-llm.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: eval-*.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reviewpilot .
      - name: Smoke test
        run: |
          docker run -d --name rp -p 8000:8000 reviewpilot
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          python3 -c "import json;print(json.dumps({'diff':open('examples/sample.diff').read()}))" > body.json
          curl -fs -X POST localhost:8000/api/review -H 'content-type: application/json' -d @body.json | grep -q request_changes
