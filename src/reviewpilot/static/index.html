<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#11141b;--panel2:#161a23;--line:#242a36;--ink:#e8ebf1;--mute:#8d95a5;--blue:#3b8cff;--crit:#ff4d5e;--high:#ff8a3d;--med:#f5c542;--low:#4fb3ff;--ok:#2fd27a;--add:#12261b;--addl:#1b3a29}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:14px max(3vw,16px);border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo svg{width:28px;height:28px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;color:var(--mute);font:600 14px Inter,sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected=true]{background:var(--panel2);color:var(--ink)}
.model{font:500 12.5px "JetBrains Mono",monospace;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
main{padding:22px max(3vw,16px);max-width:1440px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.ph small{color:var(--mute);font-weight:500}
textarea{width:100%;height:520px;background:var(--bg);color:var(--ink);border:0;padding:14px 16px;font:12.5px/1.6 "JetBrains Mono",monospace;resize:vertical;outline:none}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:600 13.5px Inter,sans-serif;padding:8px 14px;border-radius:9px;cursor:pointer;min-height:38px}
.btn.pri{background:linear-gradient(135deg,#3b8cff,#2563eb);border:0;color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap}
.verdict{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line)}
.verdict .badge{font-weight:800;font-size:13px;padding:6px 12px;border-radius:8px}
.v-request_changes{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.v-comment{background:color-mix(in srgb,var(--med) 18%,transparent);color:var(--med)}
.v-approve{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.verdict p{margin:0;color:var(--mute);font-size:14px}
.agents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.agent{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.agent b{display:block;font-size:24px}
.agent span{color:var(--mute);font-size:13px;text-transform:capitalize}
.timeline{padding:14px 16px;border-bottom:1px solid var(--line)}
.timeline h4,.findings h4{margin:0 0 10px;font-size:13px;color:var(--mute);font-weight:600}
.tl-row{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:10px;font:12.5px "JetBrains Mono",monospace;margin-bottom:6px}
.tl-track{position:relative;height:14px;background:var(--panel2);border-radius:4px}
.tl-bar{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--blue);min-width:3px}
.tl-bar.error{background:var(--crit)}
.tl-row em{color:var(--mute);font-style:normal;text-align:right}
.findings{padding:14px 16px}
.f{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.f:first-of-type{border-top:0}
.sev{font:700 11px Inter,sans-serif;text-transform:uppercase;padding:3px 8px;border-radius:6px;align-self:start}
.s-critical{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.s-high{background:color-mix(in srgb,var(--high) 20%,transparent);color:var(--high)}
.s-medium{background:color-mix(in srgb,var(--med) 20%,transparent);color:var(--med)}
.s-low{background:color-mix(in srgb,var(--low) 20%,transparent);color:var(--low)}
.f h5{margin:0;font-size:14.5px}
.f code{font:12px "JetBrains Mono",monospace;color:var(--mute)}
.f p{grid-column:2;margin:0;color:var(--mute);font-size:14px}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.diff{margin-top:20px}
.file{border-top:1px solid var(--line)}
.file h3{margin:0;padding:10px 16px;font:600 13px "JetBrains Mono",monospace;background:var(--panel2)}
.code{overflow-x:auto;font:12.5px/1.65 "JetBrains Mono",monospace}
.ln{display:grid;grid-template-columns:52px 18px 1fr;white-space:pre}
.ln .n{color:#4d5566;text-align:right;padding-right:10px;user-select:none}
.ln.add{background:var(--add)}
.ln.add .n{background:var(--addl);color:#7fbf98}
.ln.del{background:#2a1517;color:#d9a3a8}
.ln.flag{box-shadow:inset 3px 0 var(--high)}
.cmt{margin:6px 16px 10px 70px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:14px/1.55 Inter,sans-serif;white-space:normal}
.cmt b{font-size:14px}
.cmt p{margin:6px 0 0;color:var(--mute)}
.cmt pre{margin:8px 0 0;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-x:auto;font:12px "JetBrains Mono",monospace;color:#b9e6c9}
.cmt small{display:block;margin-top:6px;color:#5f6879;font:11.5px "JetBrains Mono",monospace}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
th{color:var(--mute);font-weight:600;font-size:12.5px;border-top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:28px}.stat span{color:var(--mute);font-size:13px}
[hidden]{display:none!important}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1000px){.grid{grid-template-columns:1fr}textarea{height:260px}}
@media (max-width:600px){.agents,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}nav{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#3b8cff"/><path d="M9 17l4.5 4.5L23 11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>ReviewPilot</div>
  <span class="model" id="model">model: …</span>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="play">Playground</button>
    <button role="tab" aria-selected="false" data-tab="hist">History</button>
  </nav>
</header>

<main>
  <section id="play">
    <div class="grid">
      <div class="panel">
        <div class="ph">Pull request diff <small>paste <code>git diff</code> output</small></div>
        <textarea id="diff" spellcheck="false" wrap="off" placeholder="diff --git a/app.py b/app.py ..."></textarea>
        <div class="ph" style="border-top:1px solid var(--line);border-bottom:0">
          <div class="row"><button class="btn" id="sample">Load sample PR</button><button class="btn" id="clear">Clear</button></div>
          <button class="btn pri" id="run">Run review</button>
        </div>
      </div>
      <div class="panel" id="out">
        <div class="empty" id="empty">Run a review to see each agent's findings, the execution timeline and inline comments.</div>
        <div id="result" hidden>
          <div class="verdict"><span class="badge" id="badge"></span><p id="vtext"></p></div>
          <div class="agents" id="agents"></div>
          <div class="timeline"><h4>Agent execution timeline</h4><div id="tl"></div></div>
          <div class="findings"><h4>Findings, ranked by severity</h4><div id="flist"></div></div>
        </div>
      </div>
    </div>
    <div class="panel diff" id="diffview" hidden><div class="ph">Inline review <small>comments as they appear on GitHub</small></div><div id="files"></div></div>
  </section>

  <section id="hist" hidden>
    <div class="stats" id="stats"></div>
    <div class="panel"><table><thead><tr><th>Repository</th><th>PR</th><th>Verdict</th><th class="num">Findings</th><th class="num">Files</th><th class="num">Time</th><th>When</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>

<script>
{
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const AGENTS = [["security", "security"], ["bug", "bugs"], ["performance", "performance"], ["testing", "testing"]];
const VERDICT = { request_changes: "Changes requested", comment: "Comments", approve: "Looks good" };

fetch("/health").then((r) => r.json()).then((d) => { $("model").textContent = "model: " + d.model; }).catch(() => {});

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach((x) => x.setAttribute("aria-selected", x === b));
  $("play").hidden = b.dataset.tab !== "play";
  $("hist").hidden = b.dataset.tab !== "hist";
  if (b.dataset.tab === "hist") loadHistory();
}));

$("sample").onclick = () => { $("diff").value = $("sample-diff").textContent.trim() + "\n"; };
$("clear").onclick = () => { $("diff").value = ""; };

$("run").onclick = async () => {
  const diff = $("diff").value;
  if (!diff.trim()) { $("diff").focus(); return; }
  const btn = $("run");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Agents reviewing…';
  try {
    const r = await fetch("/api/review", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ diff }) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    render(await r.json(), diff);
  } catch (e) {
    $("empty").hidden = false; $("result").hidden = true; $("empty").textContent = "Review failed: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Run review";
  }
};

function render(res, diff) {
  $("empty").hidden = true; $("result").hidden = false;
  $("badge").className = "badge v-" + res.verdict; $("badge").textContent = VERDICT[res.verdict];
  const tok = res.usage.calls ? ` · ${res.usage.input_tokens + res.usage.output_tokens} tokens` : "";
  $("vtext").textContent = `${res.findings.length} finding(s) in ${res.files_reviewed} file(s), ${res.lines_added} added lines · ${res.dropped} filtered by the verifier${tok}`;
  $("agents").innerHTML = AGENTS.map(([cat, name]) => `<div class="agent"><b>${res.findings.filter((f) => f.category === cat).length}</b><span>${name}</span></div>`).join("");
  const end = Math.max(1, ...res.trace.map((t) => t.end_ms));
  $("tl").innerHTML = res.trace.map((t) => `<div class="tl-row"><span>${esc(t.node)}</span><div class="tl-track"><div class="tl-bar ${t.status === "ok" ? "" : "error"}" style="left:${(t.start_ms / end) * 100}%;width:${Math.max(0.6, ((t.end_ms - t.start_ms) / end) * 100)}%"></div></div><em>${(t.end_ms - t.start_ms).toFixed(1)}ms</em></div>`).join("");
  $("flist").innerHTML = res.findings.length ? res.findings.map((f, i) => `
    <div class="f" data-i="${i}"><span class="sev s-${f.severity}">${f.severity}</span><div><h5>${esc(f.title)}</h5><code>${esc(f.file)}:${f.line} · ${esc(f.rule_id)} · ${esc(f.source)}</code></div><p>${esc(f.message)}</p></div>`).join("")
    : '<div class="empty">No issues found.</div>';
  renderDiff(res.findings, diff);
  document.querySelectorAll(".f").forEach((el) => el.addEventListener("click", () => document.getElementById("c" + el.dataset.i)?.scrollIntoView({ behavior: "smooth", block: "center" })));
}

function renderDiff(findings, diff) {
  const files = []; let cur = null, n = 0;
  for (const raw of diff.split("\n")) {
    if (raw.startsWith("diff --git")) { cur = { path: raw.split(" b/").pop(), lines: [] }; files.push(cur); continue; }
    if (!cur || raw.startsWith("+++") || raw.startsWith("---") || /^(index|new file|deleted file|similarity|rename)/.test(raw)) continue;
    const m = raw.match(/^@@ -\d+(?:,\d+)? \+(\d+)/);
    if (m) { n = +m[1]; cur.lines.push({ kind: "@", text: raw }); continue; }
    const k = raw[0];
    if (k === "+") cur.lines.push({ kind: "+", n: n++, text: raw.slice(1) });
    else if (k === "-") cur.lines.push({ kind: "-", text: raw.slice(1) });
    else if (k === " ") cur.lines.push({ kind: " ", n: n++, text: raw.slice(1) });
  }
  $("files").innerHTML = files.map((f) => `<div class="file"><h3>${esc(f.path)}</h3><div class="code">${f.lines.map((l) => {
    if (l.kind === "@") return `<div class="ln"><span class="n"></span><span></span><span style="color:#6b7a99">${esc(l.text)}</span></div>`;
    const hits = l.kind === "+" ? findings.map((x, i) => [x, i]).filter(([x]) => x.file === f.path && x.line === l.n) : [];
    const row = `<div class="ln ${l.kind === "+" ? "add" : l.kind === "-" ? "del" : ""} ${hits.length ? "flag" : ""}"><span class="n">${l.n ?? ""}</span><span>${l.kind === " " ? "" : l.kind}</span><span>${esc(l.text)}</span></div>`;
    return row + hits.map(([x, i]) => `<div class="cmt" id="c${i}"><span class="sev s-${x.severity}">${x.severity}</span> <b>${esc(x.title)}</b><p>${esc(x.message)}</p>${x.suggestion ? `<pre>${esc(x.suggestion)}</pre>` : ""}<small>${esc(x.rule_id)} · ${esc(x.source)} · ${esc(x.agent)} agent · confidence ${x.confidence.toFixed(2)}</small></div>`).join("");
  }).join("")}</div></div>`).join("");
  $("diffview").hidden = false;
}

async function loadHistory() {
  try {
    const [s, rows] = await Promise.all([fetch("/api/stats").then((r) => r.json()), fetch("/api/reviews").then((r) => r.json())]);
    $("stats").innerHTML = [["Reviews", s.reviews], ["Findings", s.findings], ["Avg. time", s.avg_duration_ms + " ms"], ["Tokens", s.tokens]]
      .map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${k}</span></div>`).join("");
    $("rows").innerHTML = rows.length ? rows.map((r) => `<tr><td>${esc(r.repo)}</td><td>${r.pr_number ? "#" + r.pr_number : "–"}</td><td><span class="badge v-${esc(r.verdict)}" style="font-size:12px;padding:3px 8px;border-radius:6px">${VERDICT[r.verdict] || esc(r.verdict)}</span></td><td class="num">${r.finding_count}</td><td class="num">${r.files_reviewed}</td><td class="num">${Math.round(r.duration_ms)} ms</td><td>${new Date(r.created_at * 1000).toLocaleString()}</td></tr>`).join("")
      : '<tr><td colspan="7" class="empty">No reviews yet. Run one in the Playground or install the GitHub App.</td></tr>';
  } catch (e) { $("rows").innerHTML = `<tr><td colspan="7">Could not load history: ${esc(e.message)}</td></tr>`; }
}
}
</script>
